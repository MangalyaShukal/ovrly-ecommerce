<?php
require_once __DIR__ . '/config/database.php';
require_once __DIR__ . '/config/auth.php';
require_once __DIR__ . '/config/admin_auth.php';
?>
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | OVRLY</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>OVRLY</h1>
                <p>Oversized. Unapologetic.</p>
            </div>

            <!-- Login Form -->
            <div class="auth-form" id="loginForm">
                <h2>Login</h2>
                <form onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" id="loginEmail" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="loginPassword" required>
                    </div>
                    <div class="form-group checkbox">
                        <input type="checkbox" id="isAdmin">
                        <label for="isAdmin">Login as Admin</label>
                    </div>
                    <button type="submit" class="btn btn-primary full-width">Login</button>
                    <p class="auth-link">Don't have an account? <a href="#" onclick="toggleForm()">Sign Up</a></p>
                </form>

                <!-- OAuth Options -->
                <div class="oauth-divider">
                    <span>Or continue with</span>
                </div>
                <div class="oauth-options">
                    <button class="oauth-btn google" onclick="loginWithGoogle()">
                        <i class="fab fa-google"></i> Google
                    </button>
                    <button class="oauth-btn apple" onclick="loginWithApple()">
                        <i class="fab fa-apple"></i> Apple
                    </button>
                </div>
            </div>

            <!-- Register Form -->
            <div class="auth-form" id="registerForm" style="display: none;">
                <h2>Create Account</h2>
                <form onsubmit="handleRegister(event)">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="registerName" required>
                    </div>
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" id="registerEmail" required>
                    </div>
                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="tel" id="registerPhone" placeholder="10 digit number" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="registerPassword" required>
                    </div>
                    <div class="form-group">
                        <label>Confirm Password</label>
                        <input type="password" id="registerConfirmPassword" required>
                    </div>
                    <button type="submit" class="btn btn-primary full-width">Sign Up</button>
                    <p class="auth-link">Already have an account? <a href="#" onclick="toggleForm()">Login</a></p>
                </form>
            </div>
        </div>
    </div>

    <script>
        function toggleForm() {
            document.getElementById('loginForm').style.display = document.getElementById('loginForm').style.display === 'none' ? 'block' : 'none';
            document.getElementById('registerForm').style.display = document.getElementById('registerForm').style.display === 'none' ? 'block' : 'none';
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const isAdmin = document.getElementById('isAdmin').checked;

            try {
                const response = await fetch('api/login.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password, isAdmin })
                });
                const data = await response.json();

                if (data.success) {
                    showToast('Login successful!', 'success');
                    setTimeout(() => {
                        if (isAdmin) {
                            window.location.href = 'admin/dashboard.php';
                        } else {
                            window.location.href = 'index.html';
                        }
                    }, 1500);
                } else {
                    showToast(data.message, 'error');
                }
            } catch (error) {
                showToast('Login failed', 'error');
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('registerName').value;
            const email = document.getElementById('registerEmail').value;
            const phone = document.getElementById('registerPhone').value;
            const password = document.getElementById('registerPassword').value;
            const confirmPassword = document.getElementById('registerConfirmPassword').value;

            try {
                const response = await fetch('api/register.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, phone, password, confirmPassword })
                });
                const data = await response.json();

                if (data.success) {
                    showToast(data.message, 'success');
                    setTimeout(() => toggleForm(), 1500);
                } else {
                    showToast(data.message, 'error');
                }
            } catch (error) {
                showToast('Registration failed', 'error');
            }
        }

        function loginWithGoogle() {
            showToast('Google login coming soon!', 'info');
        }

        function loginWithApple() {
            showToast('Apple ID login coming soon!', 'info');
        }

        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
    </script>
</body>
</html>
